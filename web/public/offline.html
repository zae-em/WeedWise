<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12392f">
  <title>WeedWise | You’re offline</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#17382e;background:#f4f6ef;line-height:1.6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{max-width:460px;width:100%;padding:clamp(24px,6vw,40px);border:1px solid #dce5d8;border-radius:24px;background:#fff}
    img{display:block;width:72px;height:72px}h1{line-height:1.2}p{text-align:justify}
    a{display:inline-block;background:#1c5846;color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:9px}
    a:focus-visible{outline:3px solid #8eaf96;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="./weedwise-logo.svg" width="72" height="72" alt="WeedWise logo">
    <h1>You’re offline.</h1>
    <p>WeedWise needs an internet connection to load the app, identify plants and answer chat questions. Reconnect, then try again.</p>
    <a href="./">Try again</a>
  </main>
</body>
</html>
